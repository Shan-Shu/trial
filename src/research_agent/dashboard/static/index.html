<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>research-agent 看板 · 动态本体与智能体状态</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1>research-agent 科研文献智能体看板</h1>
        <p class="db-label" id="dbLabel">…</p>
      </div>
    </div>
    <div class="top-actions">
      <label class="db-switch">数据库
        <select id="dbSelect" title="切换动态本体数据库"></select>
      </label>
      <label class="switch">
        <input type="checkbox" id="autoRefresh" checked />
        <span>自动刷新 6s</span>
      </label>
      <button id="refreshBtn" class="btn">⟳ 刷新</button>
    </div>
  </header>

  <section class="stat-row" id="statChips"></section>

  <div class="layout">
    <!-- 左侧：智能体状态 + 活动日志 -->
    <aside class="sidebar">
      <h2>智能体工作状态</h2>
      <div id="agentBoard"></div>

      <h2 class="mt">最近活动</h2>
      <ul class="activity" id="activityList"></ul>
    </aside>

    <!-- 右侧：图谱 / 文献 -->
    <main class="main">
      <nav class="tabs">
        <button class="tab" data-tab="workflow" id="tabWorkflow">研究流程</button>
        <button class="tab active" data-tab="graph" id="tabGraph">本体图谱</button>
        <button class="tab" data-tab="papers" id="tabPapers">文献列表</button>
        <button class="tab" data-tab="reviews" id="tabReviews">人工审核</button>
        <button class="tab" data-tab="events" id="tabEvents">事件与日志</button>
        <button class="tab" data-tab="planner" id="tabPlanner">规划指令</button>
      </nav>

      <section id="view-workflow" class="view hidden">
        <div id="studyBanner" class="study-banner"></div>
        <div class="flow-grid" id="studyNodes"></div>
        <div class="flow-cols">
          <div>
            <h3 class="section-title">本轮运行摘要</h3>
            <div id="studySummary" class="summary-card"></div>
          </div>
          <div>
            <h3 class="section-title">数据构建节点</h3>
            <div id="pipelineNodes" class="pipeline-list"></div>
          </div>
        </div>
        <h3 class="section-title mt">本轮事件</h3>
        <div id="studyEvents" class="study-events"></div>
      </section>

      <section id="view-graph" class="view">
        <div class="graph-toolbar">
          <div class="tfilters" id="typeFilters"></div>
          <div class="tool">
            <label>最低置信度 <span id="minConfVal">0</span></label>
            <input type="range" id="minConf" min="0" max="1" step="0.05" value="0" />
          </div>
          <input type="search" id="qSearch" placeholder="按名称搜索节点…" />
          <button class="btn small" id="btnApplyGraph">应用</button>
          <button class="btn small ghost" id="btnResetGraph">重置</button>
          <span class="graph-stats" id="graphStats"></span>
        </div>
        <div id="graphBox"><p class="hint">正在加载本体图谱…</p></div>
        <div id="structurePanel" class="structure-panel"></div>
      </section>

      <section id="view-papers" class="view hidden">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>入库时间</th><th>来源</th><th>标题</th><th>期刊/库</th>
                <th>年份</th><th>决策</th><th>Q</th><th>状态</th>
                <th>实体/关系/事件</th><th></th>
              </tr>
            </thead>
            <tbody id="paperTbody"></tbody>
          </table>
        </div>
      </section>

      <section id="view-reviews" class="view hidden">
        <div class="review-toolbar">
          <h3 class="section-title">待人工审核文献</h3>
          <label class="switch review-switch">
            <input type="checkbox" id="reviewHistoryToggle" />
            <span>显示审核历史</span>
          </label>
          <span class="graph-stats" id="reviewCount"></span>
        </div>
        <div id="reviewList"></div>
      </section>

      <section id="view-events" class="view hidden">
        <div class="event-toolbar">
          <select id="eventNodeFilter">
            <option value="">全部节点</option>
            <option value="retrieval">检索</option>
            <option value="quality">质量控制</option>
            <option value="knowledge">知识提取</option>
            <option value="study">研究流程</option>
          </select>
          <input type="search" id="eventSearch" placeholder="按论文 key / 日志内容搜索…" />
          <button class="btn small" id="btnEventFilter">应用过滤</button>
          <button class="btn small ghost" id="btnEventReset">重置</button>
          <span class="graph-stats" id="eventCount"></span>
        </div>
        <div class="event-list" id="eventList"></div>
      </section>

      <section id="view-planner" class="view hidden">
        <div class="planner-box">
          <h3 class="section-title">工作规划节点交互</h3>
          <p class="muted-text">输入研究需求后，可先生成任务单，或直接把指令后台发送给完整研究流程。</p>
          <textarea id="plannerRequest" rows="5"
            placeholder="示例：尝试提出一种炔酰胺合成多元氮杂化合物的新方法"></textarea>
          <div class="planner-actions">
            <button class="btn" id="btnPlannerPlan">发送给规划节点</button>
            <button class="btn ghost" id="btnPlannerStudy">后台运行完整研究流程</button>
          </div>
        </div>
        <div id="plannerResult" class="planner-result hidden"></div>
      </section>
    </main>
  </div>

  <!-- 详情面板 -->
  <section id="detailPanel" class="detail hidden">
    <div class="detail-head">
      <span id="detailTitle">详情</span>
      <button class="btn small ghost" id="detailClose">✕</button>
    </div>
    <div id="detailBody"></div>
  </section>

  <div id="toast" class="toast hidden"></div>
  <script src="/static/vendor/vis-network.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
